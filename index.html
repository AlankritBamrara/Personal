<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Romantic Scratch Cards</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;
 font-family:Arial,sans-serif;
 min-height:100vh;
 background:linear-gradient(180deg,#fff0f5,#ffd6e7,#ffc2da);
 color:#7a1745;
 overflow-x:hidden;
}
body:before{
 content:"❤ ❤ ❤ ❤ ❤";
 position:fixed;
 top:20px;
 width:100%;
 text-align:center;
 opacity:.12;
 font-size:40px;
 letter-spacing:30px;
 pointer-events:none;
}
.container{
 max-width:430px;
 margin:auto;
 padding:24px 18px 50px;
}
.titleBox{
 text-align:center;
 background:rgba(255,255,255,.6);
 backdrop-filter:blur(8px);
 border-radius:30px;
 padding:25px 20px;
 box-shadow:0 8px 30px rgba(175,30,90,.15);
 margin-bottom:24px;
}
.badge{
 display:inline-block;
 background:#fff;
 padding:10px 18px;
 border-radius:40px;
 font-weight:bold;
 margin-bottom:14px;
}
h1{
 font-size:34px;
 line-height:1.2;
 margin:0 0 10px;
}
.subtitle{font-size:18px}
.cards{
 display:grid;
 gap:22px;
}
.card{
 position:relative;
 height:240px;
 border-radius:32px;
 overflow:hidden;
 background:linear-gradient(135deg,#fff3f8,#ffd4e5);
 box-shadow:0 12px 30px rgba(160,40,100,.2);
 border:1px solid rgba(255,255,255,.7);
}
.prize{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:28px;
}
.emoji{font-size:52px;margin-bottom:14px}
.prize h2{margin:0 0 10px;font-size:29px}
.prize p{margin:0;font-size:20px;line-height:1.4}
canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
}
.locked{
 position:absolute;
 inset:0;
 background:rgba(120,20,70,.45);
 backdrop-filter:blur(3px);
 display:none;
 color:#fff;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 font-size:26px;
 font-weight:bold;
}
.locked small{font-size:14px;margin-top:8px}
.claimed{
 display:none;
 margin-top:18px;
 background:#fff;
 padding:10px 18px;
 border-radius:50px;
 font-weight:bold;
}
.revealNote{
 position:absolute;
 bottom:12px;
 left:50%;
 transform:translateX(-50%);
 background:rgba(255,255,255,.8);
 padding:7px 14px;
 border-radius:30px;
 font-size:12px;
 font-weight:bold;
}
.success{
 display:none;
 margin-top:28px;
 text-align:center;
 background:rgba(255,255,255,.8);
 border-radius:28px;
 padding:24px;
 box-shadow:0 8px 25px rgba(0,0,0,.08);
}
</style>
</head>
<body>
<div class="container">
<div class="titleBox">
<div class="badge">✨ Romantic Surprise ✨</div>
<h1>Hey Shinjini,<br>scratch any card and redeem a gift for yourself.</h1>
<div class="subtitle">Choose only one — the other two will lock 💖</div>
</div>

<div class="cards" id="cards"></div>

<div class="success" id="successBox">
<h2>💞 Gift Claimed!</h2>
<p>Show me this screen anytime to redeem your surprise.</p>
</div>
</div>

<script>
const prizes=[
{emoji:'🎁',title:'Gift Week',message:'One gift everyday this week'},
{emoji:'🍰',title:'Three Dessert Coupons',message:'Any place, any dessert, any time'},
{emoji:'🎬',title:'Three Movies',message:"You pick for me, I'll watch without complaining"}
];

let selectedCard=null;
const cardsWrap=document.getElementById('cards');

prizes.forEach((p,i)=>{
const card=document.createElement('div');
card.className='card';
card.innerHTML=`
<div class='prize'>
<div class='emoji'>${p.emoji}</div>
<h2>${p.title}</h2>
<p>${p.message}</p>
<div class='claimed'>Redeemed 💖</div>
</div>
<canvas></canvas>
<div class='locked'>🔒 Locked<small>Another gift was chosen</small></div>
<div class='revealNote'>Scratch to reveal</div>
`;
cardsWrap.appendChild(card);
setupScratch(card,i);
});

function lockOthers(chosen){
 document.querySelectorAll('.card').forEach((card,i)=>{
   if(i!==chosen){
      card.querySelector('.locked').style.display='flex';
      let c=card.querySelector('canvas');
      c.style.pointerEvents='none';
   }
 });
 document.getElementById('successBox').style.display='block';
}

function setupScratch(card,index){
 const canvas=card.querySelector('canvas');
 const note=card.querySelector('.revealNote');
 const claimed=card.querySelector('.claimed');
 const ctx=canvas.getContext('2d',{willReadFrequently:true});

 function sizeCanvas(){
   const rect=card.getBoundingClientRect();
   const dpr=window.devicePixelRatio||1;
   canvas.width=rect.width*dpr;
   canvas.height=rect.height*dpr;
   canvas.style.width=rect.width+'px';
   canvas.style.height=rect.height+'px';
   ctx.setTransform(dpr,0,0,dpr,0,0);

   let g=ctx.createLinearGradient(0,0,rect.width,rect.height);
   g.addColorStop(0,'#f8a8c7');
   g.addColorStop(1,'#d66495');
   ctx.fillStyle=g;
   ctx.fillRect(0,0,rect.width,rect.height);

   for(let i=0;i<40;i++){
     ctx.fillStyle='rgba(255,255,255,.35)';
     ctx.beginPath();
     ctx.arc(Math.random()*rect.width,Math.random()*rect.height,Math.random()*8+2,0,Math.PI*2);
     ctx.fill();
   }

   ctx.fillStyle='rgba(255,255,255,.92)';
   ctx.font='bold 22px Arial';
   ctx.textAlign='center';
   ctx.fillText('Scratch Here ✨',rect.width/2,rect.height/2);
 }

 sizeCanvas();
 window.addEventListener('resize',sizeCanvas);

 let drawing=false;
 let completed=false;

 function pos(e){
   let t=e.touches?e.touches[0]:e;
   let r=canvas.getBoundingClientRect();
   return {x:t.clientX-r.left,y:t.clientY-r.top};
 }

 function scratch(x,y){
   ctx.globalCompositeOperation='destination-out';
   ctx.beginPath();
   ctx.arc(x,y,24,0,Math.PI*2);
   ctx.fill();
 }

 function start(e){
   if(selectedCard!==null && selectedCard!==index) return;
   if(completed) return;
   drawing=true;
   note.style.display='none';
   let p=pos(e);
   scratch(p.x,p.y);
   e.preventDefault();
 }

 function move(e){
   if(!drawing || completed) return;
   let p=pos(e);
   scratch(p.x,p.y);
   e.preventDefault();
 }

 function end(){
 drawing=false;
 if(completed) return;
 let pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
 let clear=0;
 for(let i=3;i<pixels.length;i+=24){
   if(pixels[i]<80) clear++;
 }
 if(clear/(pixels.length/24)>.55){
    completed=true;
    selectedCard=index;
    canvas.style.display='none';
    claimed.style.display='inline-block';
    lockOthers(index);
 }
 }

 canvas.addEventListener('mousedown',start);
 canvas.addEventListener('mousemove',move);
 window.addEventListener('mouseup',end);
 canvas.addEventListener('touchstart',start,{passive:false});
 canvas.addEventListener('touchmove',move,{passive:false});
 window.addEventListener('touchend',end);
}
</script>
</body>
</html>
